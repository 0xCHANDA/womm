name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: gofmt check
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "not gofed:"
            echo "$out"
            exit 1
          fi

      - name: go mod tidy reproducibility
        run: |
          cp go.mod go.mod.bak
          if command -v go >/dev/null 2>&1; then
            go mod tidy
            diff go.mod go.mod.bak && rm -f go.mod.bak || { echo "go.mod drifted"; exit 1; }
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: go build
        run: go build ./cmd/womm
