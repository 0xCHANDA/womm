name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: gofmt check
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "not gofmt'd:"
            echo "$out"
            exit 1
          fi

      - name: enforce Go 1.24 baseline (no silent toolchain upgrade)
        env:
          GOTOOLCHAIN: local
        run: |
          actual=$(go env GOVERSION)
          echo "toolchain: $actual"
          case "$actual" in
            go1.24.*) ;;
            *) echo "expected go1.24 toolchain, got $actual"; exit 1 ;;
          esac

      - name: go mod tidy reproducibility
        run: |
          cp go.mod go.mod.bak
          cp go.sum go.sum.bak
          go mod tidy
          diff go.mod go.mod.bak && diff go.sum go.sum.bak && rm -f go.mod.bak go.sum.bak \
            || { echo "go.mod/go.sum drifted"; exit 1; }

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: go build
        run: go build ./cmd/womm
